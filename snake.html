<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #eee;
  }
  .game-container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #00ff88, #00ccff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .info-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    font-size: 14px;
  }
  .info-item span { font-weight: bold; color: #00ff88; }
  canvas {
    border: 2px solid #00ff88;
    border-radius: 10px;
    background: #0a0a1a;
    display: block;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00ff88, #00ccff);
    color: #1a1a2e;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,255,136,0.4); }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.2); }
  .tip {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
    color: #888;
  }
  .game-over {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    display: none;
    z-index: 100;
  }
  .game-over h2 {
    font-size: 32px;
    color: #ff4444;
    margin-bottom: 10px;
  }
  .game-over p {
    font-size: 18px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="game-container">
  <h1>🐍 贪吃蛇</h1>
  
  <div class="info-bar">
    <div class="info-item">得分：<span id="score">0</span></div>
    <div class="info-item">最高分：<span id="highScore">0</span></div>
    <div class="info-item">模式：<span id="mode">手动</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="controls">
    <button class="btn-primary" onclick="startGame()">开始游戏</button>
    <button class="btn-secondary" onclick="toggleMode()">切换AI模式</button>
    <button class="btn-secondary" onclick="resetScore()">重置记录</button>
  </div>

  <p class="tip">方向键控制蛇的移动 · 吃到食物得分 · 撞墙或撞自己游戏结束</p>
</div>

<div class="game-over" id="gameOver">
  <h2>游戏结束</h2>
  <p>最终得分：<span id="finalScore">0</span></p>
  <button class="btn-primary" onclick="startGame()">再来一局</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [{x: 10, y: 10}];
let food = {x: 15, y: 15};
let dx = 0;
let dy = 0;
let score = 0;
let highScore = localStorage.getItem('snakeHighScore') || 0;
let gameLoop = null;
let gameRunning = false;
let aiMode = false;
let gameSpeed = 120;

document.getElementById('highScore').textContent = highScore;

function drawGame() {
  // 清空画布
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 画网格
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i <= tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * gridSize, 0);
    ctx.lineTo(i * gridSize, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * gridSize);
    ctx.lineTo(canvas.width, i * gridSize);
    ctx.stroke();
  }

  // 画食物
  ctx.fillStyle = '#ff4444';
  ctx.shadowColor = '#ff4444';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 画蛇
  snake.forEach((segment, index) => {
    if (index === 0) {
      ctx.fillStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 8;
    } else {
      const green = Math.max(100, 255 - index * 8);
      ctx.fillStyle = `rgb(0, ${green}, 100)`;
      ctx.shadowBlur = 0;
    }
    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
  });
  ctx.shadowBlur = 0;
}

function moveSnake() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};

  // 撞墙检测
  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    gameOver();
    return;
  }

  // 撞自己检测
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  // 吃食物
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      document.getElementById('highScore').textContent = highScore;
    }
    spawnFood();
  } else {
    snake.pop();
  }
}

function spawnFood() {
  let newFood;
  do {
    newFood = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
  } while (snake.some(s => s.x === newFood.x && s.y === newFood.y));
  food = newFood;
}

function gameOver() {
  gameRunning = false;
  clearInterval(gameLoop);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').style.display = 'block';
}

function startGame() {
  document.getElementById('gameOver').style.display = 'none';
  snake = [{x: 10, y: 10}];
  dx = 1;
  dy = 0;
  score = 0;
  document.getElementById('score').textContent = 0;
  spawnFood();
  gameRunning = true;
  
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(() => {
    if (aiMode) aiMove();
    moveSnake();
    drawGame();
  }, gameSpeed);
}

function toggleMode() {
  aiMode = !aiMode;
  document.getElementById('mode').textContent = aiMode ? 'AI自动' : '手动';
}

function resetScore() {
  highScore = 0;
  localStorage.removeItem('snakeHighScore');
  document.getElementById('highScore').textContent = 0;
}

// AI逻辑：贪心 + 避障
function aiMove() {
  const head = snake[0];
  const directions = [
    {dx: 1, dy: 0},  // 右
    {dx: -1, dy: 0}, // 左
    {dx: 0, dy: 1},  // 下
    {dx: 0, dy: -1}  // 上
  ];

  // 不能反向
  const validDirs = directions.filter(d => !(d.dx === -dx && d.dy === -dy));

  // 过滤掉会撞墙和撞自己的方向
  const safeDirs = validDirs.filter(d => {
    const newHead = {x: head.x + d.dx, y: head.y + d.dy};
    if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) return false;
    if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) return false;
    return true;
  });

  if (safeDirs.length === 0) return;

  // 从安全方向中选离食物最近的
  let bestDir = safeDirs[0];
  let minDist = Infinity;

  for (const d of safeDirs) {
    const newHead = {x: head.x + d.dx, y: head.y + d.dy};
    const dist = Math.abs(newHead.x - food.x) + Math.abs(newHead.y - food.y);
    
    // 预判下一步是否安全（简单死路检测）
    const nextSafe = directions.some(d2 => {
      if (d2.dx === -d.dx && d2.dy === -d.dy) return false;
      const nextHead = {x: newHead.x + d2.dx, y: newHead.y + d2.dy};
      if (nextHead.x < 0 || nextHead.x >= tileCount || nextHead.y < 0 || nextHead.y >= tileCount) return false;
      if (snake.slice(0, -1).some(s => s.x === nextHead.x && s.y === nextHead.y)) return false;
      return true;
    });

    if (nextSafe && dist < minDist) {
      minDist = dist;
      bestDir = d;
    }
  }

  dx = bestDir.dx;
  dy = bestDir.dy;
}

// 键盘控制
document.addEventListener('keydown', (e) => {
  if (aiMode) return;
  if (!gameRunning) return;
  
  switch(e.key) {
    case 'ArrowUp':
      if (dy !== 1) { dx = 0; dy = -1; }
      break;
    case 'ArrowDown':
      if (dy !== -1) { dx = 0; dy = 1; }
      break;
    case 'ArrowLeft':
      if (dx !== 1) { dx = -1; dy = 0; }
      break;
    case 'ArrowRight':
      if (dx !== -1) { dx = 1; dy = 0; }
      break;
  }
});

// 初始画面
drawGame();
</script>

</body>
</html>
