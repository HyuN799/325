<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇游戏</title>
<style>
  :root {
    --bg-start: #1a1a2e;
    --bg-end: #16213e;
    --text: #eee;
    --text-muted: #888;
    --container-bg: rgba(255,255,255,0.05);
    --container-border: rgba(255,255,255,0.1);
    --info-bg: rgba(255,255,255,0.08);
    --info-border: rgba(255,255,255,0.1);
    --primary: #00ff88;
    --secondary: #00ccff;
    --btn-secondary-bg: rgba(255,255,255,0.1);
    --btn-secondary-border: rgba(255,255,255,0.2);
    --btn-secondary-text: #eee;
    --canvas-bg: #0a0a1a;
    --canvas-border: #00ff88;
    --grid-line: rgba(255,255,255,0.03);
    --diff-btn-bg: rgba(255,255,255,0.08);
    --diff-btn-text: #aaa;
    --diff-btn-border: rgba(255,255,255,0.1);
    --gameover-bg: rgba(0,0,0,0.9);
    --shadow: rgba(0,0,0,0.4);
  }

  body.theme-light {
    --bg-start: #f0f4ff;
    --bg-end: #e6e9f2;
    --text: #2d3748;
    --text-muted: #a0aec0;
    --container-bg: rgba(255,255,255,0.7);
    --container-border: rgba(255,255,255,0.8);
    --info-bg: rgba(255,255,255,0.6);
    --info-border: rgba(100,100,200,0.1);
    --primary: #667eea;
    --secondary: #764ba2;
    --btn-secondary-bg: rgba(102,126,234,0.1);
    --btn-secondary-border: rgba(102,126,234,0.3);
    --btn-secondary-text: #4c51bf;
    --canvas-bg: #f7fafc;
    --canvas-border: #667eea;
    --grid-line: rgba(100,100,200,0.08);
    --diff-btn-bg: rgba(102,126,234,0.08);
    --diff-btn-text: #718096;
    --diff-btn-border: rgba(102,126,234,0.15);
    --gameover-bg: rgba(255,255,255,0.95);
    --shadow: rgba(100,100,200,0.15);
  }

  body.theme-sakura {
    --bg-start: #fce4ec;
    --bg-end: #f3e5f5;
    --text: #4a2c5a;
    --text-muted: #9c7ab0;
    --container-bg: rgba(255,255,255,0.55);
    --container-border: rgba(255,255,255,0.7);
    --info-bg: rgba(255,255,255,0.5);
    --info-border: rgba(236,72,153,0.15);
    --primary: #ec4899;
    --secondary: #a78bfa;
    --btn-secondary-bg: rgba(236,72,153,0.1);
    --btn-secondary-border: rgba(236,72,153,0.3);
    --btn-secondary-text: #9d174d;
    --canvas-bg: #fdf2f8;
    --canvas-border: #ec4899;
    --grid-line: rgba(236,72,153,0.08);
    --diff-btn-bg: rgba(236,72,153,0.08);
    --diff-btn-text: #9c7ab0;
    --diff-btn-border: rgba(236,72,153,0.15);
    --gameover-bg: rgba(253,242,248,0.95);
    --shadow: rgba(236,72,153,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
    transition: all 0.3s ease;
  }
  .game-container {
    background: var(--container-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--container-border);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px var(--shadow);
  }
  h1 {
    text-align: center;
    font-size: 28px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .info-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    padding: 10px 20px;
    background: var(--info-bg);
    border: 1px solid var(--info-border);
    border-radius: 10px;
    font-size: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .info-item span { font-weight: bold; color: var(--primary); }
  canvas {
    border: 2px solid var(--canvas-border);
    border-radius: 10px;
    background: var(--canvas-bg);
    display: block;
  }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px var(--shadow); }
  .btn-secondary {
    background: var(--btn-secondary-bg);
    color: var(--btn-secondary-text);
    border: 1px solid var(--btn-secondary-border);
  }
  .btn-secondary:hover { background: var(--btn-secondary-border); }
  .tip {
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .game-over {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--gameover-bg);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    display: none;
    z-index: 100;
    box-shadow: 0 20px 60px var(--shadow);
  }
  .game-over h2 {
    font-size: 32px;
    color: #ff4444;
    margin-bottom: 10px;
  }
  .game-over p {
    font-size: 18px;
    margin-bottom: 20px;
    color: var(--text);
  }

  /* 难度选择 */
  .difficulty-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .diff-btn {
    padding: 6px 16px;
    font-size: 12px;
    border-radius: 20px;
    background: var(--diff-btn-bg);
    color: var(--diff-btn-text);
    border: 1px solid var(--diff-btn-border);
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .diff-btn:hover { background: var(--diff-btn-border); }
  .diff-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #fff;
    border-color: transparent;
    font-weight: 600;
  }

  /* 主题切换 */
  .theme-bar {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 15px;
  }
  .theme-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--container-border);
    cursor: pointer;
    transition: all 0.2s;
    padding: 0;
  }
  .theme-btn:hover { transform: scale(1.15); }
  .theme-btn.active {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary), 0 0 10px var(--primary);
  }
  .theme-dark { background: linear-gradient(135deg, #1a1a2e, #16213e); }
  .theme-light { background: linear-gradient(135deg, #f0f4ff, #e6e9f2); }
  .theme-sakura { background: linear-gradient(135deg, #fce4ec, #f3e5f5); }
</style>
</head>
<body>

<div class="game-container">
  <h1>🐍 贪吃蛇</h1>

  <div class="difficulty-bar">
    <button class="diff-btn" onclick="setDifficulty('easy')" id="diffEasy">简单</button>
    <button class="diff-btn active" onclick="setDifficulty('normal')" id="diffNormal">普通</button>
    <button class="diff-btn" onclick="setDifficulty('hard')" id="diffHard">困难</button>
  </div>

  <div class="theme-bar">
    <button class="theme-btn theme-dark active" onclick="setTheme('dark')" id="themeDark" title="深色主题"></button>
    <button class="theme-btn theme-light" onclick="setTheme('light')" id="themeLight" title="浅色主题"></button>
    <button class="theme-btn theme-sakura" onclick="setTheme('sakura')" id="themeSakura" title="樱花主题"></button>
  </div>
  
  <div class="info-bar">
    <div class="info-item">得分：<span id="score">0</span></div>
    <div class="info-item">最高分：<span id="highScore">0</span></div>
    <div class="info-item">模式：<span id="mode">手动</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="controls">
    <button class="btn-primary" onclick="startGame()">开始游戏</button>
    <button class="btn-secondary" onclick="toggleMode()">切换AI模式</button>
    <button class="btn-secondary" onclick="resetScore()">重置记录</button>
  </div>

  <p class="tip">方向键控制蛇的移动 · 吃到食物得分 · 撞墙或撞自己游戏结束</p>
</div>

<div class="game-over" id="gameOver">
  <h2>游戏结束</h2>
  <p>最终得分：<span id="finalScore">0</span></p>
  <button class="btn-primary" onclick="startGame()">再来一局</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake = [{x: 10, y: 10}];
let food = {x: 15, y: 15};
let dx = 0;
let dy = 0;
let score = 0;
let highScore = localStorage.getItem('snakeHighScore') || 0;
let gameLoop = null;
let gameRunning = false;
let aiMode = false;
let gameSpeed = 120;
let difficulty = 'normal';
let currentTheme = localStorage.getItem('snakeTheme') || 'dark';

const speedMap = { easy: 180, normal: 120, hard: 70 };

const themeColors = {
  dark: { canvas: '#0a0a1a', grid: 'rgba(255,255,255,0.03)', food: '#ff4444', snakeHead: '#00ff88', snakeBody: 'rgb(0, GREEN, 100)', snakeBodyBase: 255, snakeBodyMin: 100 },
  light: { canvas: '#f7fafc', grid: 'rgba(100,100,200,0.08)', food: '#f56565', snakeHead: '#667eea', snakeBody: 'rgb(102, GREEN, 234)', snakeBodyBase: 180, snakeBodyMin: 120 },
  sakura: { canvas: '#fdf2f8', grid: 'rgba(236,72,153,0.08)', food: '#f472b6', snakeHead: '#ec4899', snakeBody: 'rgb(236, GREEN, 153)', snakeBodyBase: 200, snakeBodyMin: 100 }
};

document.getElementById('highScore').textContent = highScore;

function setTheme(name) {
  currentTheme = name;
  localStorage.setItem('snakeTheme', name);
  document.body.className = 'theme-' + name;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('theme' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  drawGame();
}

// 初始化主题
setTheme(currentTheme);

function setDifficulty(level) {
  difficulty = level;
  gameSpeed = speedMap[level];
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('diff' + level.charAt(0).toUpperCase() + level.slice(1)).classList.add('active');
  if (gameRunning) {
    clearInterval(gameLoop);
    gameLoop = setInterval(() => {
      if (aiMode) aiMove();
      moveSnake();
      drawGame();
    }, gameSpeed);
  }
}

function drawGame() {
  const colors = themeColors[currentTheme];

  ctx.fillStyle = colors.canvas;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = colors.grid;
  for (let i = 0; i <= tileCount; i++) {
    ctx.beginPath();
    ctx.moveTo(i * gridSize, 0);
    ctx.lineTo(i * gridSize, canvas.height);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * gridSize);
    ctx.lineTo(canvas.width, i * gridSize);
    ctx.stroke();
  }

  ctx.fillStyle = colors.food;
  ctx.shadowColor = colors.food;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  snake.forEach((segment, index) => {
    if (index === 0) {
      ctx.fillStyle = colors.snakeHead;
      ctx.shadowColor = colors.snakeHead;
      ctx.shadowBlur = 8;
    } else {
      const green = Math.max(colors.snakeBodyMin, colors.snakeBodyBase - index * 8);
      ctx.fillStyle = colors.snakeBody.replace('GREEN', green);
      ctx.shadowBlur = 0;
    }
    ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
  });
  ctx.shadowBlur = 0;
}

function moveSnake() {
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};

  if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
    gameOver();
    return;
  }

  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      document.getElementById('highScore').textContent = highScore;
    }
    spawnFood();
  } else {
    snake.pop();
  }
}

function spawnFood() {
  let newFood;
  do {
    newFood = {
      x: Math.floor(Math.random() * tileCount),
      y: Math.floor(Math.random() * tileCount)
    };
  } while (snake.some(s => s.x === newFood.x && s.y === newFood.y));
  food = newFood;
}

function gameOver() {
  gameRunning = false;
  clearInterval(gameLoop);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOver').style.display = 'block';
}

function startGame() {
  document.getElementById('gameOver').style.display = 'none';
  snake = [{x: 10, y: 10}];
  dx = 1;
  dy = 0;
  score = 0;
  document.getElementById('score').textContent = 0;
  spawnFood();
  gameRunning = true;
  
  if (gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(() => {
    if (aiMode) aiMove();
    moveSnake();
    drawGame();
  }, gameSpeed);
}

function toggleMode() {
  aiMode = !aiMode;
  document.getElementById('mode').textContent = aiMode ? 'AI自动' : '手动';
}

function resetScore() {
  highScore = 0;
  localStorage.removeItem('snakeHighScore');
  document.getElementById('highScore').textContent = 0;
}

function aiMove() {
  const head = snake[0];
  const directions = [
    {dx: 1, dy: 0},
    {dx: -1, dy: 0},
    {dx: 0, dy: 1},
    {dx: 0, dy: -1}
  ];

  const validDirs = directions.filter(d => !(d.dx === -dx && d.dy === -dy));

  const safeDirs = validDirs.filter(d => {
    const newHead = {x: head.x + d.dx, y: head.y + d.dy};
    if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) return false;
    if (snake.some(s => s.x === newHead.x && s.y === newHead.y)) return false;
    return true;
  });

  if (safeDirs.length === 0) return;

  let bestDir = safeDirs[0];
  let minDist = Infinity;

  for (const d of safeDirs) {
    const newHead = {x: head.x + d.dx, y: head.y + d.dy};
    const dist = Math.abs(newHead.x - food.x) + Math.abs(newHead.y - food.y);
    
    const nextSafe = directions.some(d2 => {
      if (d2.dx === -d.dx && d2.dy === -d.dy) return false;
      const nextHead = {x: newHead.x + d2.dx, y: newHead.y + d2.dy};
      if (nextHead.x < 0 || nextHead.x >= tileCount || nextHead.y < 0 || nextHead.y >= tileCount) return false;
      if (snake.slice(0, -1).some(s => s.x === nextHead.x && s.y === nextHead.y)) return false;
      return true;
    });

    if (nextSafe && dist < minDist) {
      minDist = dist;
      bestDir = d;
    }
  }

  dx = bestDir.dx;
  dy = bestDir.dy;
}

document.addEventListener('keydown', (e) => {
  if (aiMode) return;
  if (!gameRunning) return;
  
  switch(e.key) {
    case 'ArrowUp':
      if (dy !== 1) { dx = 0; dy = -1; }
      break;
    case 'ArrowDown':
      if (dy !== -1) { dx = 0; dy = 1; }
      break;
    case 'ArrowLeft':
      if (dx !== 1) { dx = -1; dy = 0; }
      break;
    case 'ArrowRight':
      if (dx !== -1) { dx = 1; dy = 0; }
      break;
  }
});

drawGame();
</script>

</body>
</html>
